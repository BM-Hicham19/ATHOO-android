name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'src/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check that your game APK is in place
        run: |
          if [ ! -f android/app/src/main/assets/game.apk ]; then
            echo "::error::Put your game APK at android/app/src/main/assets/game.apk (in this PRIVATE repo) and push again."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK pieces
        shell: bash
        run: |
          echo "y" | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AdventureTime-android-apk
          path: android/app/build/outputs/apk/release/*.apk
